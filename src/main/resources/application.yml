spring:
  application:
    name: bookworm
  datasource:
    # Credentials come from the environment only. There are deliberately no defaults for
    # user/password: startup fails fast when they are missing.
    url: ${BOOKWORM_DB_URL:jdbc:postgresql://127.0.0.1:5432/bookworm_db}
    username: ${BOOKWORM_DB_USER}
    password: ${BOOKWORM_DB_PASSWORD}
    hikari:
      connection-timeout: 5000
      maximum-pool-size: 10
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

# Secrets come from the environment only and have no defaults: startup fails when the JWT secret is missing,
# not base64, or shorter than 32 bytes. The bootstrap admin is created only when BOTH admin variables are set.
bookworm:
  security:
    bcrypt-strength: 12
    jwt:
      secret: ${BOOKWORM_JWT_SECRET}
      issuer: bookworm
      ttl: 60m
    lockout:
      max-attempts: 5
      duration: 15m
    admin:
      email: ${BOOKWORM_ADMIN_EMAIL:}
      password: ${BOOKWORM_ADMIN_PASSWORD:}

server:
  address: 127.0.0.1
  port: 8080
  shutdown: graceful
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

# API docs are off unless a profile (dev/test) turns them on.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  pattern:
    level: "%5p [%X{traceId:-}]"
